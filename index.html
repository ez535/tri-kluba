<title>Три клуба — прототип</title>
<meta name="theme-color" content="#E9EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1912" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Три клуба">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFE6;--surface:#FBFCFA;--ink:#13241A;--muted:#56685C;--line:#C9D5CB;
  --accent:#C8213A;--gold:#F2B705;--ok:#1E8A4C;--on-gold:#13241A;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1912;--surface:#15251B;--ink:#E6EFE7;--muted:#93A69A;--line:#2A3D31;
  --accent:#FF5466;--gold:#FFC62B;--ok:#3CCB7F;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0D1912;--surface:#15251B;--ink:#E6EFE7;--muted:#93A69A;--line:#2A3D31;
  --accent:#FF5466;--gold:#FFC62B;--ok:#3CCB7F;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;padding:20px 18px 40px}
h1{font:800 clamp(40px,12vw,56px)/1 var(--display);margin:22px 0 10px;letter-spacing:-.02em}
h2{font:600 17px/1.3 var(--display);margin:26px 0 12px}
.lead{margin:0;color:var(--muted);max-width:40ch}
.meta{color:var(--muted);font-size:14px;margin:18px 2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* карты клубов */
.hand{display:flex;justify-content:center;gap:4%;padding:14px 0 18px}
.card{position:relative;width:30%;aspect-ratio:3/4;border:2px solid var(--ink);border-radius:12px;overflow:hidden;
  background:var(--surface);box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column}
.card:nth-child(1){transform:rotate(-5deg) translateY(8px)}
.card:nth-child(3){transform:rotate(5deg) translateY(8px)}
.stripes{flex:1;background:repeating-linear-gradient(135deg,var(--c1) 0 16px,var(--c2) 16px 32px)}
.plate{border-top:2px solid var(--ink);background:var(--surface);font:600 12px/1.2 var(--display);padding:8px 6px;text-align:center;
  min-height:46px;display:flex;align-items:center;justify-content:center;hyphens:auto;overflow-wrap:anywhere}
.deal{animation:deal .45s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:calc(var(--i)*90ms)}
.card:nth-child(1).deal{--r:-5deg}.card:nth-child(2).deal{--r:0deg}.card:nth-child(3).deal{--r:5deg}
@keyframes deal{from{opacity:0;transform:translateY(-40px) rotate(0)}to{opacity:1;transform:translateY(var(--y,8px)) rotate(var(--r))}}
.card:nth-child(2).deal{--y:0px}
.hero-hand{padding-top:4px}.hero-hand .card{width:26%}
@media (prefers-reduced-motion:reduce){.deal{animation:none}}

/* уровни */
.levels{display:grid;gap:12px}
.level{display:grid;gap:2px;text-align:left;background:var(--surface);border:2px solid var(--ink);border-radius:14px;
  padding:14px 16px;box-shadow:0 4px 0 var(--ink);transition:transform .1s}
.level:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.lname{font:600 18px/1.3 var(--display)}
.ldesc{color:var(--muted)}
.lprog{font-size:13px;color:var(--muted);margin-top:4px}
.rules{margin-top:10px;border-top:2px solid var(--line);padding-top:12px}
.rules summary{font-weight:800;cursor:pointer}
.rules p{color:var(--muted);margin:10px 0}

/* игровой экран */
.top{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.top b{color:var(--ink)}
.timer{display:flex;align-items:center;gap:12px;margin-top:12px}
.bar{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ink);transition:width .1s linear}
.bar.low span{background:var(--accent)}
#secs{font:800 22px/1 var(--display);min-width:2ch;text-align:right}
.status{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:6px 0 12px}
.status i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.status.on i{background:var(--gold)}
.answer{display:flex;gap:8px}
#ans{flex:1;min-width:0;font:600 18px var(--body);padding:13px 14px;border:2px solid var(--ink);border-radius:12px;
  background:var(--surface);color:var(--ink)}
#ans:disabled{opacity:.5}
.btn{font-weight:800;border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px}
.btn:disabled{opacity:.4;cursor:default}
.btn.wide{width:100%;padding:15px}
.btn.ghost{background:transparent;color:var(--ink)}
.ac{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.ac button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.msg{min-height:1.5em;margin:12px 2px 0;font-weight:600}
.msg.soft{font-weight:400;color:var(--muted);margin-top:6px}
.boosts{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px;align-items:center}
.boosts span{width:100%;font-size:13px;color:var(--muted)}
.chip{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip:disabled{opacity:.35;cursor:default}

/* финал */
.retired{margin:16px 0 10px;background:var(--gold);color:var(--on-gold);font-weight:800;padding:10px 14px;border-radius:10px;border:2px solid var(--ink)}
.hints{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:6px}
.hints li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border:2px dashed var(--line);border-radius:10px;color:var(--muted)}
.hints li b{font-weight:600}
.hints li.open{border:2px solid var(--ink);background:var(--surface);color:var(--ink)}
.hints li.open span{color:var(--muted)}
.hints li.open b{font-weight:800;text-align:right}
.hints li.fresh{animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}}
@media (prefers-reduced-motion:reduce){.hints li.fresh{animation:none}}

/* итоги */
.score{text-align:center;padding-top:10px}
.score>p{font:600 18px var(--display);margin:0}
.board{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 4px}
.board b{font:800 64px/1 var(--display)}
.board i{font:800 40px/1 var(--display);font-style:normal;color:var(--muted)}
.board span{font-size:14px;color:var(--muted)}
.gift{display:inline-block;background:var(--gold);color:var(--on-gold);font-weight:800;padding:6px 12px;border-radius:999px;margin:8px 0 0}
.tablewrap{overflow-x:auto;margin:20px -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:2px solid var(--ink)}
td{vertical-align:top;padding:10px 4px;border-bottom:1px solid var(--line)}
td.rn{font:800 14px var(--display);color:var(--muted)}
.tclubs{line-height:1.6}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%);border:1px solid var(--ink);vertical-align:-1px}
.ex{color:var(--muted);font-size:12px;margin-top:4px}
.p{display:block;font:800 16px var(--display);margin-top:2px}
.p6{color:var(--ok);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}.p5{color:var(--ok)}.p3{color:var(--gold)}.p1{color:var(--muted)}.p0{color:var(--accent)}
tr.fin td{border-bottom:2px solid var(--ink)}
.actions{display:grid;gap:10px}
.sub{color:var(--muted);font-size:14px;margin:-4px 0 10px}
.leagues{display:flex;flex-wrap:wrap;gap:6px}
.leagues+.sub{margin-top:10px}
.chip.lg{padding:8px 14px}
.chip.lg.on{background:var(--ink);color:var(--bg)}
.levels.off{opacity:.4}
.fix{border:1.5px solid var(--ink);background:var(--surface);border-radius:999px;padding:5px 12px;margin:6px 6px 0 0;font-weight:700;font-size:14px}
.fix.no{border-color:var(--line);font-weight:600;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:8px 0 0;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--ink)}
.tier{margin:14px 0 10px;padding:10px 14px;border-radius:10px;border:2px solid var(--ink);font-weight:800;background:var(--surface)}
.tier.rare{background:var(--gold);color:var(--on-gold)}
.count{font-size:13px;color:var(--muted);margin:2px 2px 8px}
.tries h3{font:600 15px var(--display);margin:18px 0 8px}
.try{border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.cmp{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.m{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--line)}
.m.yes{background:var(--ok);color:var(--bg)}
.m.near,.m.was{background:var(--gold);color:var(--on-gold)}
.m.up,.m.down,.m.older,.m.younger,.m.early,.m.late{background:var(--ink);color:var(--bg)}
.m.na{opacity:.5}
.botline{margin:14px auto 0;max-width:34ch;font-weight:600}
.nav{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 10px;font-size:14px;color:var(--muted)}
.exit{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.exit.armed{border-color:var(--accent);color:var(--accent)}
.link{display:block;background:none;border:0;padding:8px 2px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px}
/* поддержка */
.sup-link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px;font-weight:600}
.nav .sup-link{margin-left:auto;padding-left:12px}
[data-support]:disabled{opacity:.45;cursor:default}
.nav span{margin-left:12px}
.fitcount{font-size:13px;color:var(--muted);margin:-6px 2px 8px;text-align:center}
.support{margin-top:22px;border-top:2px solid var(--line);padding-top:14px}
.support p{color:var(--muted);margin:0 0 10px}
.sup-foot{text-align:center;color:var(--muted);font-size:14px;margin-top:16px}
.sup-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:20}
@media (min-width:560px){.sup-back{align-items:center}}
.sup{background:var(--bg);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:18px;width:100%;max-width:480px;box-shadow:0 6px 0 var(--ink)}
.sup h2{margin:0 0 8px}
.sup textarea{width:100%;font:500 16px/1.4 var(--body);padding:12px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);color:var(--ink);resize:vertical}
.sup-ctx{font-size:12px;color:var(--muted);margin:6px 2px 0}
.sup-act{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
</style>
</head>

  ['laliga','Ла Лига','real barca atl valencia sevilla villarreal betis'],
  ['seriea','Серия А','juve milan inter roma lazio napoli fio parma'],
  ['bundes','Бундеслига','bayern bvb b04 hsv schalke werder stuttgart wolfsburg'],
  ['ligue1','Лига 1','psg monaco lyon om lille bordeaux'],
  ['rpl','РПЛ','zenit spartak cska lokomotiv dynamo krasnodar']
].map(([id,name,c])=>({id,name,clubs:c.split(' ')}));
function allowedClubs(){const on=new Set(STATS.leagues);return new Set(LEAGUES.filter(l=>on.has(l.id)).flatMap(l=>l.clubs));}
const TCACHE=new Map();
function allTriples(allowed){
  const ck=[...allowed].sort().join();if(TCACHE.has(ck))return TCACHE.get(ck);
  const m=new Map();
  PL.forEach(p=>{if(p.sl<30)return;const c=p.clubs.filter(x=>allowed.has(x));
    for(let i=0;i<c.length;i++)for(let j=i+1;j<c.length;j++)for(let k=j+1;k<c.length;k++){
      const t=[c[i],c[j],c[k]],key=[...t].sort().join();if(!m.has(key))m.set(key,t);}});
  const r=[...m.values()];TCACHE.set(ck,r);return r;
}
// Сложность троек: лёгкий — топ-клубы и звезда в ответе; средний — минимум двое известных; тяжёлый — редкие тройки
const TOPCLUBS=new Set('real barca mu liv bayern juve milan inter che ars mc psg atl bvb tot roma napoli zenit spartak cska'.split(' '));
const STAR=85,KNOWN=60;
function pickTriples(level,allowed){
  const stats=t=>{const f=fitsAll(t);return {v:f.filter(p=>p.sl>=30).length,k:f.filter(p=>p.sl>=KNOWN).length,star:f.some(p=>p.sl>=STAR),best:f.reduce((b,p)=>p.sl>(b?b.sl:0)?p:b,null)};};
  const top=new Set([...allowed].filter(c=>TOPCLUBS.has(c)));
  const stages=level==='easy'?[
      [top,x=>x.star&&x.v>=3],[top,x=>x.star],[allowed,x=>x.star],[allowed,x=>x.k>=2],[allowed,x=>x.k>=1&&x.v>=2],[allowed,()=>true]]
    :level==='medium'?[[allowed,x=>x.k>=2&&x.v>=3],[allowed,x=>x.k>=1],[allowed,()=>true]]
    :[[allowed,x=>x.k===0||x.v<=2],[allowed,()=>true]];
  const out=[],keys=new Set(),anchors=new Set();
  // разнообразие: один и тот же самый известный ответ не повторяется в матче
  for(const strict of [true,false])for(const [set,pred] of stages){
    if(out.length>=ROUNDS)break;if(set.size<3)continue;
    for(const t of shuffle(allTriples(set))){
      if(out.length>=ROUNDS)break;const key=[...t].sort().join();if(keys.has(key))continue;
      const x=stats(t);if(!pred(x))continue;
      if(strict&&x.best&&anchors.has(x.best.id))continue;
      keys.add(key);if(x.best)anchors.add(x.best.id);out.push(shuffle(t));
    }
    if(strict&&out.length>=ROUNDS)break;
  }
  let i=0;while(out.length&&out.length<ROUNDS)out.push(out[i++]);
  return out;
}

// ---------- статистика ----------
const SKEY='three-clubs-proto-v1';
function loadStats(){let s=null;try{s=JSON.parse(localStorage.getItem(SKEY));}catch(e){}
  if(!s||!s.wins)s={wins:{easy:0,medium:0,hard:0},prog:{easy:0,medium:0,hard:0},hints:0,played:0};
  const ok=['epl','laliga','seriea','bundes','ligue1','rpl'];
  s.leagues=Array.isArray(s.leagues)?s.leagues.filter(x=>ok.includes(x)):[];if(!s.leagues.length)s.leagues=ok.slice();
  return s;}
function saveStats(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}}
let STATS=loadStats();

// ---------- состояние ----------
let G=null,timer=null;
const app=document.getElementById('app');

function newGame(level){
  const L=LEVELS[level],allowed=allowedClubs(),tr=pickTriples(level,allowed);if(!tr.length)return;
  G={level,L,round:0,rounds:tr.map(t=>({triple:t})),used:new Set(),botUsed:new Set(),saved:false,allowed};
  startRound();
}
function pickTier(tiers){let r=Math.random(),acc=0;for(let i=0;i<tiers.length;i++){acc+=tiers[i];if(r<acc)return i;}return 3;}
function startRound(){
  const R=G.rounds[G.round],now=performance.now();
  Object.assign(R,{start:now,deadline:G.L.time?now+G.L.time*1000:Infinity,botAt:now+(4+Math.random()*8)*1000,
    botDone:false,userDone:false,user:null,userPts:0,msg:'',boostMsg:'',boosts:{},tier:pickTier(G.L.tiers),ended:false,dealt:false});
  G.screen='round';render();focusInput();runTimer();
}
function runTimer(){clearInterval(timer);timer=setInterval(tick,100);}
function tick(){
  const now=performance.now();
  if(G.screen==='round'){
    const R=G.rounds[G.round];if(R.ended)return;
    if(!R.botDone&&now>=R.botAt){R.botDone=true;updStatus();}
    const left=Math.max(0,R.deadline-now);if(G.L.time)updTimer(left,G.L.time*1000+(R.boosts.time?5000:0));
    if(left<=0){R.botDone=true;if(!R.userDone){R.userDone=true;R.msg='Время вышло. 0 очков.';}endRound();}
    else if(R.userDone&&R.botDone)endRound();
  }else if(G.screen==='final'){
    const F=G.final;if(F.over)return;
    if(!F.botMoved&&now>=F.botAt){F.botMoved=true;if(F.botStage===F.stage)F.botDone=true;updStatus();}
    const left=Math.max(0,F.deadline-now);if(G.L.ftime)updTimer(left,G.L.ftime*1000);
    const userOk=F.userDone||F.userMoved;
    if(left<=0||(userOk&&F.botMoved&&!F.advancing)){
      if(left>0){F.advancing=true;setTimeout(()=>{F.advancing=false;nextStage();},700);}else nextStage();
    }
  }
}
function endRound(){
  const R=G.rounds[G.round];if(R.ended)return;R.ended=true;
  // ответ бота подбирается в конце раунда под итоговую тройку
  let tier=R.tier,bp=null;
  while(tier<3&&!bp){
    const want=[3,2,1][tier];
    let pool=PL.filter(p=>p.sl>=30&&fitCount(p,R.triple)===want);
    if(want===3){const fresh=pool.filter(p=>!G.botUsed.has(p.id));if(fresh.length)pool=fresh;
      // редкие ответы бота: лёгкий — никогда, средний — в 30% случаев, тяжёлый — в 60%
      const rare=pool.filter(p=>RARE.has(p.id)&&!G.botUsed.has(p.id)),common=pool.filter(p=>!RARE.has(p.id));
      if(G.level==='easy')pool=common;
      else{const share=G.level==='medium'?.3:.6;
        if(rare.length&&Math.random()<share)pool=rare;else if(common.length)pool=common;else pool=[];}
    }
    if(pool.length)bp=rnd(pool);else tier++;
  }
  R.bot=bp;R.botPts=bp?points(bp,R.triple,G.botUsed):0;if(bp)G.botUsed.add(bp.id);
  render();
}
function nextRound(){G.round++;if(G.round<ROUNDS)startRound();else startFinal();}

// ---------- ответ в раунде ----------
const amb=(ids,raw)=>ids&&ids.length>3&&!ids.some(id=>norm(PL[id].ru)===norm(raw)||norm(PL[id].en)===norm(raw));
const askName=(ids,raw)=>{document.getElementById('msg').textContent=`Фамилия «${raw}» есть у ${ids.length} игроков в базе. Уточните имя, например «Имя Фамилия». Ответ ещё не засчитан.`;};
function submitAnswer(){
  const R=G.rounds[G.round];if(R.userDone||R.ended)return;
  const inp=document.getElementById('ans');const raw=inp.value.trim();if(!raw)return;
  const ids=IDX.get(norm(raw));
  if(!ids){offerFix(raw,id=>commitAnswer([id]));return;}
  if(amb(ids,raw)){askName(ids,raw);return;}
  commitAnswer(ids);
}
function commitAnswer(ids){
  const R=G.rounds[G.round];if(R.userDone||R.ended)return;
  let best=null,bp=-1;ids.forEach(id=>{const p=PL[id],s=points(p,R.triple,G.used);if(s>bp){bp=s;best=p;}});
  R.user=best;R.userPts=bp;R.userDone=true;R.repeat=G.used.has(best.id);G.used.add(best.id);
  const k=fitCount(best,R.triple);
  R.msg=`${best.ru}: ${k} ${plural(k,'клуб','клуба','клубов')} из 3${R.repeat&&k===3?', повтор':''}${bp===6?', редкий ответ':''}. +${ptsWord(bp)}.`;
  render();
}

// ---------- бусты тренировки ----------
function useBoost(kind){
  const R=G.rounds[G.round];if(R.userDone||R.ended||R.boosts[kind])return;
  const fit=fitsAll(R.triple).filter(p=>p.sl>=30&&(kind!=='nat'||p.nat));const target=fit.find(p=>!G.used.has(p.id))||fit[0];
  if(kind==='letter'){R.boostMsg=target?`Подходящий игрок: фамилия на «${dropFirst(target.ru)[0].toUpperCase()}».`:'Подходящих игроков нет.';}
  if(kind==='nat'){R.boostMsg=target?`Один из подходящих игроков: ${NAT[target.nat]}.`:'Подходящих игроков нет.';}
  if(kind==='time'){R.deadline+=5000;R.boostMsg='+5 секунд к таймеру.';}
  if(kind==='swap'){
    const t=R.triple,opts=[];
    for(let drop=0;drop<3;drop++){
      const keep=t.filter((_,i)=>i!==drop);
      PL.forEach(p=>{if(p.sl>=30&&keep.every(c=>p.clubs.includes(c)))p.clubs.forEach(c=>{if(!t.includes(c)&&G.allowed.has(c))opts.push({drop,c});});});
    }
    if(!opts.length){R.boostMsg='Заменить клуб не получилось.';}
    else{const o=rnd(opts);const old=CLUBS[t[o.drop]][0];R.triple=t.map((c,i)=>i===o.drop?o.c:c);R.dealt=false;R.boostMsg=`«${old}» заменён на «${CLUBS[o.c][0]}».`;}
  }
  R.boosts[kind]=true;
  const v=document.getElementById('ans')?.value||'';render();const i=document.getElementById('ans');if(i){i.value=v;i.focus();}
}

// ---------- финальный раунд ----------
const HINTS=[
  ['Конфедерация',f=>`${f.conf} (${REGION[f.conf]})`],['Лига',f=>f.league],['Амплуа',f=>f.pos],
  [f=>f.retired?'Карьера':'Возраст',f=>f.retired?f.career:age(f.born)+' '+plural(age(f.born),'год','года','лет')],['Национальность',f=>NAT[f.p.nat]],
  ['Самый известный клуб',f=>clubName(f.fam)],['Клуб',f=>clubName(f.club)]
];
const shownHints=st=>2+st; // этап 1 = 3 подсказки
const fpts=(f,st)=>st?(f.rare?8:6)-st:0; // известный 5…1, малоизвестный 7…3
function candidates(F){
  const n=shownHints(F.stage);let k=0,r=0;
  (G.fpool||ALLPOOL).forEach(x=>{if(x.retired!==F.f.retired)return;
    for(let i=0;i<n;i++){if(String(HINTS[i][1](x))!==String(HINTS[i][1](F.f)))return;}
    x.rare?r++:k++;});
  return {k,r};
}
function compare(g,h){
  const out=[];const pg=g.p||g;
  out.push(['Конф.',(g.conf||NATCONF[pg.nat])===h.conf?'yes':'no']);
  out.push(['Лига',g.league?(g.league===h.league?'yes':'no'):'?']);
  out.push(['Амплуа',g.pos?(g.pos===h.pos?'yes':LINE(g.pos)===LINE(h.pos)?'near':'no'):'?']);
  out.push(['Нац.',pg.nat===h.p.nat?'yes':'no']);
  if(g.born&&g.retired===h.retired){
    if(h.retired){const a=+g.career.slice(0,4),b=+h.career.slice(0,4);out.push(['Карьера',a===b?'yes':b<a?'early':'late']);}
    else{const a=age(g.born),b=age(h.born);out.push(['Возраст',a===b?'yes':b>a?'older':'younger']);}
  }else out.push([h.retired?'Карьера':'Возраст','?']);
  out.push(['Изв. клуб',g.fam!=null&&g.fam===h.fam?'yes':pg.clubs.includes(h.fam)?'was':'no']);
  out.push(['Клуб',g.club?(g.club===h.club?'yes':'no'):(pg.clubs.includes(h.club)?'was':'?')]);
  return out;
}
const MARK={yes:'✓',no:'✗',near:'≈',up:'↑ больше',down:'↓ меньше',older:'↑ старше',younger:'↓ моложе',early:'↓ раньше',late:'↑ позже',was:'играл там','?':'нет данных'};
function startFinal(){
  const lv=x=>G.level==='hard'||!x.hard;
  G.fpool=ALLPOOL.filter(lv);
  const ok=x=>lv(x)&&(STATS.finalAll||x.p.clubs.some(c=>G.allowed.has(c))||G.allowed.has(x.club));
  let A=APOOL.filter(ok),Rt=FPOOL.filter(ok),Rr=RPOOL.filter(ok);if(!A.length&&!Rt.length){A=APOOL.filter(lv);Rt=FPOOL.filter(lv);}
  const f=(Rr.length&&Math.random()<.25)?rnd(Rr):(A.length&&(!Rt.length||Math.random()<.5))?rnd(A):rnd(Rt);
  let botStage=0;for(let s=1;s<=5;s++){if(Math.random()<Math.min(1,G.L.fin+.18*(s-1))){botStage=s;break;}}
  if(f.rare&&botStage)botStage=Math.min(5,botStage+1);
  G.final={f,stage:1,botStage,userStage:0,botDone:false,userDone:false,over:false,msg:'',history:[],tries:[]};
  G.screen='final';setupStage();render();focusInput();runTimer();
}
function setupStage(){
  const F=G.final,now=performance.now(),len=G.L.ftime;
  F.deadline=len?now+len*1000:Infinity;F.userMoved=false;F.botMoved=false;
  F.botAt=now+(F.botDone?1+Math.random()*3:4+Math.random()*10)*1000;
}
function nextStage(){
  const F=G.final;if(F.over)return;
  if(F.stage>=5||(F.userDone&&F.botDone)){F.over=true;clearInterval(timer);showResults();return;}
  F.stage++;if(!F.userDone&&F.userMoved)F.msg=F.msg.startsWith('Пропуск')?'Открыта новая подсказка.':F.msg.replace(' Следующая попытка на следующем этапе.','')+' Открыта новая подсказка, можно угадывать снова.';setupStage();render();focusInput();
}
function submitGuess(){
  const F=G.final;if(F.userDone||F.userMoved||F.over)return;
  const raw=document.getElementById('ans').value.trim();if(!raw)return;
  const n=norm(raw);
  if(F.f.p.vars.includes(n))return commitGuess(F.f.p.id);
  if(!IDX.has(n)){offerFix(raw,id=>commitGuess(id));return;}
  if(amb(IDX.get(n),raw)){askName(IDX.get(n),raw);return;}
  commitGuess(IDX.get(n)[0]);
}
function commitGuess(id){
  const F=G.final;if(F.userDone||F.userMoved||F.over)return;
  if(id===F.f.p.id){F.userDone=true;F.userMoved=true;F.userStage=F.stage;
    F.msg=`Верно, это ${F.f.p.ru}! +${ptsWord(fpts(F.f,F.stage))}. Подводим итоги…`;
    F.over=true;clearInterval(timer);render();setTimeout(showResults,1400);return;}
  else{F.userMoved=true;const g=BYPID.get(id)||PL[id];F.tries.push({name:PL[id].ru,cmp:compare(g,F.f)});
    F.msg=`${PL[id].ru} — неверно. Сравнение добавлено ниже. Следующая попытка на следующем этапе.`;}
  render();
}

function osa(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  const d=[];for(let i=0;i<=a.length;i++){d[i]=[i];}for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++){let rowMin=1e9;
    for(let j=1;j<=b.length;j++){const c=a[i-1]===b[j-1]?0:1;
      d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
      rowMin=Math.min(rowMin,d[i][j]);}
    if(rowMin>max)return max+1;}
  return d[a.length][b.length];
}
function closest(n){
  if(n.length<3)return [];
  const max=n.length<=4?1:n.length<=7?2:3;let best=max+1,ids=new Set();
  for(const [v,list] of IDX){const d=osa(n,v,max);
    if(d<best){best=d;ids=new Set(list);}else if(d===best)list.forEach(i=>ids.add(i));}
  return best<=max?[...ids].slice(0,3):[];
}
function offerFix(raw,cb){
  const s=closest(norm(raw)),m=document.getElementById('msg');
  if(!s.length){m.textContent='Не нашли такого игрока. Проверьте написание: ответ ещё не засчитан.';return;}
  m.innerHTML='Может быть, вы имели в виду: '+s.map(id=>`<button class="fix" data-id="${id}">${esc(PL[id].ru)}</button>`).join('')+'<button class="fix no">Нет</button>';
  m.querySelectorAll('.fix').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('no')){m.textContent='Исправьте ответ и отправьте ещё раз.';const i=document.getElementById('ans');if(i)i.focus();return;}
    cb(+b.dataset.id);});
}
function skipRound(){const R=G.rounds[G.round];if(R.userDone||R.ended)return;R.userDone=true;R.userPts=0;R.msg='Раунд пропущен. 0 очков.';render();}
function passStage(){const F=G.final;if(F.userDone||F.userMoved||F.over)return;F.userMoved=true;F.msg='Пропуск. Ждём следующую подсказку.';render();}
function navHTML(){return `<nav class="nav"><button class="exit" id="exit">← Выйти</button><span>${G.L.name}</span><button class="sup-link" data-support disabled title="Скоро появится">Сообщить об ошибке</button></nav>`;}
function fitN(t){const n=fitsAll(t).filter(p=>p.sl>=30).length;return n>=20?'20+ игроков':n+' '+plural(n,'игрок','игрока','игроков');}
// ---------- поддержка ----------
const dbReady=(async()=>{try{return window.claude&&window.claude.use?await window.claude.use('db'):null;}catch(e){return null;}})();
function supportContext(){
  if(!G||!G.screen||G.screen==='menu')return {screen:'Главный экран'};
  const c={screen:G.screen==='round'?`Раунд ${G.round+1}`:G.screen==='final'?`Финальный раунд, этап ${G.final.stage}`:'Итоги матча',level:G.L&&G.L.name};
  if(G.screen==='round'){const R=G.rounds[G.round];c.clubs=R.triple.map(clubName).join(', ');const i=document.getElementById('ans');if(i&&i.value)c.typed=i.value;if(R.user)c.answer=R.user.ru;}
  if(G.screen==='final'||G.screen==='results'){if(G.final)c.finalPlayer=G.final.f.p.ru;}
  if(G.screen==='results')c.rounds=G.rounds.map((r,i)=>`${i+1}: ${r.triple.map(clubName).join(', ')} — ${r.user?r.user.ru:'нет ответа'} (${r.userPts})`).join('; ');
  return c;
}
const SUPPORT_EMAIL='john2196mail@gmail.com';

    b.disabled=true;m.textContent='Отправляем…';
    const db=await dbReady;
    const full=text+'\n\n---\n'+Object.entries(ctx).map(([k,v])=>k+': '+v).join('\n');
    const viaMail=(auto)=>{
      if(auto){try{window.location.href=mailHref(text,ctx);}catch(e){}}
      m.innerHTML=`Открываем почту с готовым письмом на ${SUPPORT_EMAIL}. Если почта не открылась, <a href="${mailHref(text,ctx)}" target="_blank" rel="noopener">нажмите сюда</a> или <button class="sup-link" id="supCopy">скопируйте текст</button> и отправьте его на этот адрес.`;
      b.disabled=false;
      document.getElementById('supCopy').onclick=async()=>{try{await navigator.clipboard.writeText(full);m.lastChild.textContent=' Текст скопирован.';}catch(e){ta.value=full;ta.select();}};
    };
    if(!db){viaMail(true);return;}
    try{
      await db.collection('reports').add({text:text.slice(0,2000),context:ctx,status:'new',createdAt:new Date().toISOString()});
      d.querySelector('.sup').innerHTML='<h2>Спасибо!</h2><p class="sub">Сообщение отправлено. Мы проверим и исправим.</p><div class="sup-act"><button class="btn" id="supOk">Вернуться к игре</button></div>';
      document.getElementById('supOk').onclick=close;document.getElementById('supOk').focus();
    }catch(e){viaMail(true);}
  };
}
// Поддержка временно отключена: кнопки видны, но неактивны. Чтобы включить, верните SUPPORT_ON=true и уберите disabled у кнопок.
const SUPPORT_ON=false;
document.addEventListener('click',e=>{if(SUPPORT_ON&&e.target.closest&&e.target.closest('[data-support]'))openSupport();});
function bindExit(){const b=document.getElementById('exit');if(!b)return;let armed=false,t;
  b.onclick=()=>{if(!armed){armed=true;b.textContent='Выйти? Матч не сохранится';b.classList.add('armed');t=setTimeout(()=>{armed=false;b.textContent='← Выйти';b.classList.remove('armed');},3000);}
    else{clearTimeout(t);clearInterval(timer);G.screen='menu';render();}};}

// ---------- итоги ----------
function showResults(){
  const F=G.final;
  const u=G.rounds.reduce((s,r)=>s+r.userPts,0),b=G.rounds.reduce((s,r)=>s+r.botPts,0);
  const uf=fpts(F.f,F.userStage),bf=fpts(F.f,F.botStage);
  const ut=u+uf,bt=b+bf;let res=Math.sign(ut-bt);
  if(!res){const u5=G.rounds.filter(r=>r.userPts>=5).length,b5=G.rounds.filter(r=>r.botPts>=5).length;res=Math.sign(u5-b5)||Math.sign(uf-bf);}
  Object.assign(G,{ut,bt,uf,bf,res,screen:'results'});
  if(!G.saved){G.saved=true;STATS.played++;
    if(res>0){STATS.wins[G.level]++;STATS.prog[G.level]++;if(STATS.prog[G.level]>=G.L.need){STATS.prog[G.level]=0;STATS.hints++;G.gotHint=true;}}
    saveStats(STATS);}
  render();
}

// ---------- отрисовка ----------
function card(c,i,anim){const [n,c1,c2]=CLUBS[c];
  return `<div class="card${anim?' deal':''}" style="--c1:${c1};--c2:${c2};--i:${i}"><div class="stripes"></div><div class="plate">${esc(n)}</div></div>`;}
function timerHTML(){return `<div class="timer"><div class="bar"><span id="bar"></span></div><b id="secs"></b></div>`;}
function statusHTML(txt,on){return `<div class="status${on?' on':''}" id="status"><i></i>${txt}</div>`;}
function inputHTML(disabled,label,action){
  return `<div class="answer"><label for="ans" class="sr">${label}</label>
  <input id="ans" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="${label}" ${disabled?'disabled':''}>
  <button class="btn" id="go" ${disabled?'disabled':''}>${action}</button></div><ul class="ac" id="ac"></ul>`;
}
function render(){
  if(!G||G.screen==='menu')return renderMenu();
  if(G.screen==='round')return renderRound();
  if(G.screen==='final')return renderFinal();
  if(G.screen==='results')return renderResults();
}
function renderMenu(){
  G=G||{};G.screen='menu';clearInterval(timer);
  const on=new Set(STATS.leagues),combos=on.size?allTriples(allowedClubs()).length:0;
  const lv=Object.entries(LEVELS).map(([k,L])=>`
    <button class="level" data-level="${k}">
      <span class="lname">${L.name}</span><span class="ldesc">${L.desc}</span>
      <span class="lprog">Побед: ${STATS.wins[k]}. До подсказки для мультиплеера: ${STATS.prog[k]} из ${L.need}</span>
    </button>`).join('');
  app.innerHTML=`
  <header class="hero">
    <div class="hand hero-hand">${['barca','zenit','ars'].map((c,i)=>card(c,i,!window.heroDone)).join('')}</div>
    <h1>Три клуба</h1>
    <p class="lead">Назовите фамилию футболиста, который играл за все три клуба. Тренировка с ботом: 5 раундов и финальный раунд.</p>
  </header>
  <section><h2>Лиги</h2>
    <p class="sub">Тройки клубов собираются только из выбранных чемпионатов.</p>
    <div class="leagues">${LEAGUES.map(l=>`<button class="chip lg${on.has(l.id)?' on':''}" data-lg="${l.id}" aria-pressed="${on.has(l.id)}">${l.name}</button>`).join('')}</div>
    <p class="sub">${!on.size?'Выберите хотя бы одну лигу.':combos<ROUNDS?`Сочетаний клубов: ${combos}. Тройки будут повторяться, добавьте ещё лигу.`:`Сочетаний клубов: ${combos}.`}</p>
    <label class="check"><input type="checkbox" id="finalAll" ${STATS.finalAll?'checked':''}><span>В финальном раунде загадывать игроков из всех лиг, а не только из выбранных</span></label>
  </section>
  <section><h2>Выберите уровень</h2><div class="levels${combos?'':' off'}">${lv}</div></section>
  <p class="meta">Подсказок накоплено: <b>${STATS.hints}</b>. Матчей сыграно: ${STATS.played}.</p>
  <details class="rules"><summary>Как считаются очки</summary>
    <p>Игрок играл за все три клуба: 5 очков, за два: 3, за один: 1. Малоизвестный игрок за все три клуба — 6 очков. Если вы уже называли этого игрока в матче, максимум 3 очка.</p>
    <p>В финальном раунде загадан действующий или завершивший карьеру игрок. Известный игрок: 5 очков на первом этапе, на каждом следующем на одно меньше; малоизвестный: от 7 до 3. После неверной попытки игра сравнивает названного игрока с загаданным. Одна попытка на этап. Как только вы угадали, матч заканчивается, а бот показывает, на каком этапе угадал он.</p>
    <p>Достаточно написать фамилию, имя подставится само. Принимаются русские и английские написания. Если в фамилии опечатка, игра предложит правильный вариант.</p>
    <p>Ответы бота скрыты до конца матча. В базе прототипа ${PL.length} игроков.</p>
  </details>
  <section class="support"><p>Заметили ошибку в игроке, клубе или подсказке? Сообщите нам — мы всё проверим и исправим.</p>
    <button class="btn ghost wide" data-support disabled>Написать в поддержку · скоро</button></section>`;
  const fa=document.getElementById('finalAll');if(fa)fa.onchange=()=>{STATS.finalAll=fa.checked;saveStats(STATS);};
  window.heroDone=true;
  app.querySelectorAll('.level').forEach(b=>{b.disabled=!combos;b.onclick=()=>newGame(b.dataset.level);});
  app.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{const id=b.dataset.lg;const set=new Set(STATS.leagues);
    set.has(id)?set.delete(id):set.add(id);STATS.leagues=[...set];saveStats(STATS);const y=window.scrollY;renderMenu();window.scrollTo(0,y);});
}
function renderRound(){
  const R=G.rounds[G.round],done=R.userDone||R.ended,total=G.rounds.reduce((s,r)=>s+(r.userPts||0),0);
  const boosts=[['letter','Первая буква'],['nat','Национальность'],['time','+5 секунд'],['swap','Замена клуба']]
    .filter(([k])=>k!=='time'||G.L.time).map(([k,t])=>`<button class="chip" data-boost="${k}" ${R.boosts[k]||done?'disabled':''}>${t}</button>`).join('');
  app.innerHTML=`
  ${navHTML()}
  <div class="top"><span>Раунд ${G.round+1} из ${ROUNDS}</span><span>Ваши очки: <b>${total}</b></span></div>
  ${G.L.time?timerHTML():''}
  <div class="hand">${R.triple.map((c,i)=>card(c,i,!R.dealt)).join('')}</div>
  <p class="fitcount">Под эту тройку подходят ${fitN(R.triple)}${G.level==='easy'?'. Не вспомнили игрока на все три? Игрок двух клубов из трёх тоже приносит очки':''}</p>
  ${statusHTML(R.botDone?'Соперник ответил':'Соперник думает',R.botDone)}
  ${R.ended?`<button class="btn wide" id="next">${G.round+1<ROUNDS?'Следующий раунд':'К финальному раунду'}</button>`:inputHTML(done,'Фамилия игрока','Ответить')+(done?'':`<button class="link" id="skip">Пропустить раунд</button>`)}
  <p class="msg" id="msg" aria-live="polite">${esc(R.msg)}</p>
  ${R.ended?'':`<div class="boosts"><span>Подсказки тренировки, по разу за раунд:</span>${boosts}</div><p class="msg soft">${esc(R.boostMsg)}</p>`}`;
  R.dealt=true;
  bindAnswer(submitAnswer);
  app.querySelectorAll('[data-boost]').forEach(b=>b.onclick=()=>useBoost(b.dataset.boost));
  const n=document.getElementById('next');if(n){n.onclick=nextRound;n.focus();}
  const sk=document.getElementById('skip');if(sk)sk.onclick=skipRound;
  bindExit();
  if(G.L.time)updTimer(Math.max(0,R.deadline-performance.now()),G.L.time*1000+(R.boosts.time?5000:0));
}
function renderFinal(){
  const F=G.final,n=shownHints(F.stage);
  const rows=HINTS.map(([l,fn],i)=>{const open=i<n;const st=i<3?1:i-1;const lab=typeof l==='function'?l(F.f):l;
    return `<li class="${open?'open':''}${open&&i===n-1&&F.stage>1?' fresh':''}"><span>${lab}</span><b>${open?esc(fn(F.f)):'Этап '+st}</b></li>`;}).join('');
  const dis=F.userDone||F.userMoved,cnt=candidates(F);
  const tries=F.tries.length?`<div class="tries"><h3>Ваши попытки</h3><p class="count">Стрелки показывают, чем загаданный игрок отличается от названного. ≈ — та же линия: защита, полузащита или атака.</p>${F.tries.map(t=>`<div class="try"><b>${esc(t.name)}</b><div class="cmp">${t.cmp.map(([l,v])=>`<span class="m ${v.replace('?','na')}">${l}: ${MARK[v]}</span>`).join('')}</div></div>`).join('')}</div>`:'';
  app.innerHTML=`
  ${navHTML()}
  <div class="top"><span>Финальный раунд, этап ${F.stage} из 5</span><span>На кону: <b>${ptsWord(fpts(F.f,F.stage))}</b></span></div>
  ${G.L.ftime?timerHTML():''}
  <div class="tier ${F.f.rare?'rare':''}">${F.f.rare?'Загадан малоизвестный игрок: до 7 очков':'Загадан известный игрок: до 5 очков'}${F.f.retired?'. Завершил карьеру':'. Играет сейчас'}</div>
  <ul class="hints">${rows}</ul>
  <p class="count">Под эти подсказки подходят ${cnt.k} ${plural(cnt.k,'известный','известных','известных')} и ${cnt.r} ${plural(cnt.r,'малоизвестный','малоизвестных','малоизвестных')} ${plural(cnt.k+cnt.r,'игрок','игрока','игроков')}</p>
  ${statusHTML(F.botMoved?'Соперник сделал ход':'Соперник думает',F.botMoved)}
  ${inputHTML(dis,'Фамилия игрока','Угадать')}
  ${dis?'':'<button class="link" id="pass">Не знаю, открыть следующую подсказку</button>'}
  <p class="msg" id="msg" aria-live="polite">${esc(F.msg)}</p>
  ${tries}`;
  bindAnswer(submitGuess);
  const ps=document.getElementById('pass');if(ps)ps.onclick=passStage;
  bindExit();
  if(G.L.ftime)updTimer(Math.max(0,F.deadline-performance.now()),G.L.ftime*1000);
}
function renderResults(){
  const F=G.final,head=G.res>0?'Победа':G.res<0?'Поражение':'Ничья';
  const rows=G.rounds.map((r,i)=>{const ex=fitsAll(r.triple).slice(0,3).map(p=>p.ru).join(', ');
    return `<tr><td class="rn">${i+1}</td><td><div class="tclubs">${r.triple.map(c=>`<span class="dot" style="--c1:${CLUBS[c][1]};--c2:${CLUBS[c][2]}"></span>${esc(CLUBS[c][0])}`).join('<br>')}</div>
      <div class="ex">Подходили: ${esc(ex)}</div></td>
      <td>${r.user?esc(r.user.ru):'—'}<b class="p p${r.userPts}">${r.userPts}</b></td>
      <td>${r.bot?esc(r.bot.ru):'—'}<b class="p p${r.botPts}">${r.botPts}</b></td></tr>`;}).join('');
  const st=s=>s?`угадал на этапе ${s}`:'не угадал';
  app.innerHTML=`
  <header class="score"><p>${head}</p><div class="board"><span>Вы</span><b>${G.ut}</b><i>:</i><b>${G.bt}</b><span>Бот</span></div>
    ${G.gotHint?'<p class="gift">Получена подсказка для мультиплеера</p>':''}
    <p class="botline">Финальный раунд: загадан <b>${esc(F.f.p.ru)}</b>. Вы ${F.userStage?'угадали на этапе '+F.userStage:'не угадали'}, бот ${st(F.botStage)}.</p></header>
  <div class="tablewrap"><table><thead><tr><th></th><th>Клубы</th><th>Вы</th><th>Бот</th></tr></thead><tbody>${rows}
    <tr class="fin"><td class="rn">Ф</td><td>Загадан: <b>${esc(F.f.p.ru)}</b></td>
    <td>${st(F.userStage)}<b class="p">${G.uf}</b></td><td>${st(F.botStage)}<b class="p">${G.bf}</b></td></tr></tbody></table></div>
  <div class="actions"><button class="btn wide" id="again">Ещё матч</button><button class="btn ghost wide" id="menu">Сменить уровень</button></div>
  <p class="sup-foot">Что-то посчитано неверно? <button class="sup-link" data-support disabled title="Скоро появится">Сообщить об ошибке</button></p>`;
  document.getElementById('again').onclick=()=>newGame(G.level);
  document.getElementById('menu').onclick=()=>{G.screen='menu';render();};
}
function bindAnswer(fn){
  const i=document.getElementById('ans'),b=document.getElementById('go');if(!i)return;
  b.onclick=fn;i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();fn();}};
  if(G.L.ac)i.oninput=()=>autocomplete(i.value);
}
function autocomplete(q){
  const ul=document.getElementById('ac');const n=norm(q);if(n.length<2){ul.innerHTML='';return;}
  const res=PL.filter(p=>p.vars.some(v=>v.startsWith(n)||v.split(' ').some(w=>w.startsWith(n)))).slice(0,6);
  ul.innerHTML=res.map(p=>`<li><button data-n="${esc(p.ru)}">${esc(p.ru)}</button></li>`).join('');
  ul.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=document.getElementById('ans');i.value=b.dataset.n;ul.innerHTML='';i.focus();});
}
function focusInput(){const i=document.getElementById('ans');if(i&&!i.disabled)setTimeout(()=>i.focus({preventScroll:true}),50);}
function updTimer(left,total){const b=document.getElementById('bar'),s=document.getElementById('secs');if(!b)return;
  b.style.width=Math.min(100,left/total*100)+'%';s.textContent=Math.ceil(left/1000);b.parentElement.classList.toggle('low',left<5000);}
function updStatus(){const el=document.getElementById('status');if(!el)return;
  const on=G.screen==='round'?G.rounds[G.round].botDone:G.final.botMoved;
  el.classList.toggle('on',on);el.lastChild.textContent=G.screen==='round'?(on?'Соперник ответил':'Соперник думает'):(on?'Соперник сделал ход':'Соперник думает');}
function updMsg(){const m=document.getElementById('msg');if(m)m.textContent=G.screen==='round'?G.rounds[G.round].msg:G.final.msg;}

render();
</script>
